<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- 国标 GB 1002 三孔插座(正面): 面对插座 左 N、右 L、上 PE -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="108" rx="8" fill="url(#face)" stroke="#78350f" stroke-width="2"/>
  <rect x="12" y="14" width="76" height="92" rx="6" fill="#fffef7" stroke="#cbd5e1" stroke-width="1"/>
  <!-- PE 孔(上方扁孔,国标上地) -->
  <rect x="46" y="26" width="8" height="12" rx="1" fill="#78716c"/>
  <text x="50" y="22" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" fill="#eab308">PE</text>
  <!-- 左 N 孔(国标左零) -->
  <circle cx="36" cy="58" r="7" fill="#78716c"/>
  <circle cx="36" cy="58" r="4" fill="#1f2937"/>
  <text x="36" y="72" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" fill="#3b82f6">N</text>
  <!-- 右 L 孔(国标右火) -->
  <circle cx="64" cy="58" r="7" fill="#78716c"/>
  <circle cx="64" cy="58" r="4" fill="#1f2937"/>
  <text x="64" y="72" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" fill="#dc2626">L</text>
  <!-- 顶部出线端子(按 components.json: 20=L引导红、50=?、80=?；实际引线直连对应相孔) -->
  <!-- L 端子在 x=20,引线绕到右 L 孔 -->
  <line x1="20" y1="8" x2="20" y2="14" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 12 L 20 18 L 64 18 L 64 51" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="20" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#dc2626" font-weight="700">L</text>
  <!-- N 端子在 x=50,引线绕到左 N 孔 -->
  <line x1="50" y1="8" x2="50" y2="14" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 12 L 50 22 L 36 22 L 36 51" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#3b82f6" font-weight="700">N</text>
  <!-- PE 端子在 x=80,引线绕到上 PE 孔 -->
  <line x1="80" y1="8" x2="80" y2="14" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <path d="M 80 12 L 80 18 L 54 18 L 54 26" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#eab308" font-weight="700">PE</text>
</svg>
