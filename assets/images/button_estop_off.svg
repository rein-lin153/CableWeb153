  <circle cx="12" cy="52" r="2.6" fill="#fbbf24"/>
  <circle cx="68" cy="52" r="2.6" fill="#fbbf24"/>
  <!-- 红蘑菇头(弹起态) -->
  <circle cx="40" cy="40" r="20" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="12" fill="#ef4444"/>
  <text x="40" y="44" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#fff">STOP</text>
  <text x="12" y="119" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#fde047">11</text>
