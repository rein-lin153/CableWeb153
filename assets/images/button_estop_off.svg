  <rect x="8" y="8" width="64" height="104" rx="8" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
  <!-- 急停 NC 常态闭合 -->
  <line x1="12" y1="108" x2="12" y2="52" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="52" x2="68" y2="52" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
