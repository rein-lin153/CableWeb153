<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 130">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <rect x="6" y="116" width="68" height="8" rx="2" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  <rect x="10" y="8" width="60" height="108" rx="5" fill="url(#body)" stroke="#475569" stroke-width="1.8"/>
  <rect x="14" y="12" width="52" height="100" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 拨杆(ON 向上,绿) -->
  <rect x="32" y="38" width="16" height="26" rx="3" fill="#22c55e" stroke="#15803d" stroke-width="1.2"/>
  <circle cx="40" cy="40" r="2.5" fill="#dcfce7"/>
  <text x="40" y="32" text-anchor="middle" font-family="Arial" font-size="9" fill="#16a34a" font-weight="700">ON</text>
  <text x="40" y="98" text-anchor="middle" font-family="Arial" font-size="8" fill="#475569" font-weight="700">1P</text>
  <!-- 进出线(导通:直连两色变全绿) -->
  <line x1="40" y1="14" x2="40" y2="110" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="40" cy="110" r="2.4" fill="#16a34a"/>
  <text x="40" y="11" text-anchor="middle" font-family="Arial" font-size="7" fill="#475569" font-weight="700">L</text>
  <text x="40" y="127" text-anchor="middle" font-family="Arial" font-size="7" fill="#475569" font-weight="700">L</text>
</svg>
