<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- 外壳 -->
  <rect x="6" y="14" width="68" height="92" rx="6" fill="url(#case)" stroke="#475569" stroke-width="2"/>
  <!-- 蜂鸣器符号: 半圆(IEC 音响符号) -->
  <path d="M 22 78 A 18 18 0 0 1 58 78 Z" fill="#e5e7eb" stroke="#475569" stroke-width="1.6"/>
  <!-- 静音: 灰色横线表示无声 -->
  <line x1="24" y1="78" x2="56" y2="78" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="40" y="58" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#475569">HA</text>
  <!-- 端子 -->
  <line x1="24" y1="8" x2="24" y2="22" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="24" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#dc2626" font-weight="700">L</text>
  <line x1="56" y1="8" x2="56" y2="22" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#3b82f6" font-weight="700">N</text>
</svg>
