<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --amber: #f59e0b; --amber-d: #d97706; --ink: #0f172a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: 'Segoe UI', 'Microsoft YaHei', 'Noto Sans Khmer', sans-serif; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(at 0% 0%, rgba(245,158,11,.18) 0, transparent 45%),
      radial-gradient(at 100% 100%, rgba(16,185,129,.12) 0, transparent 45%),
      linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    color: #fff; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, var(--amber), var(--amber-d));
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px -6px rgba(217,119,6,.6);
  }
  .logo svg { width: 36px; height: 36px; }
  .brand { font-size: 30px; font-weight: 900; letter-spacing: .5px; }
  .brand .c { color: var(--amber); }
  .badge {
    font-size: 15px; font-weight: 900; color: var(--ink); background: var(--amber);
    padding: 5px 14px; border-radius: 9999px; border: 2px solid var(--amber-d);
  }
  .mid { margin-top: -8px; }
  .title { font-size: 58px; font-weight: 900; line-height: 1.08; letter-spacing: -.5px; }
  .title .hl { color: var(--amber); }
  .sub { font-size: 24px; font-weight: 500; color: #cbd5e1; margin-top: 22px; line-height: 1.35; max-width: 920px; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .pills { display: flex; gap: 12px; flex-wrap: wrap; }
  .pill {
    font-size: 19px; font-weight: 800; color: #fef3c7; border: 2px solid rgba(245,158,11,.45);
    background: rgba(245,158,11,.10); padding: 10px 22px; border-radius: 14px;
  }
  .cta {
    font-size: 22px; font-weight: 900; color: var(--ink); background: var(--amber);
    padding: 16px 34px; border-radius: 16px; border: 2px solid var(--amber-d);
    box-shadow: 0 12px 30px -8px rgba(245,158,11,.5); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
    <div class="brand">B<span>·</span>W <span class="c">CABLE</span></div>
    <span class="badge">INDUSTRIAL</span>
  </div>
  <div class="mid">
    <div class="title">柬埔寨本地电缆 <span class="hl">+ 免费电工计算器</span></div>
    <div class="sub">家装布电线 · 电力主干 · 电焊机电缆 · 设备软线<br>Phnom Penh 本地发货 · Telegram / WhatsApp / 电话即时询价</div>
  </div>
  <div class="bottom">
    <div class="pills">
      <span class="pill">BVR / BVVB</span>
      <span class="pill">YJV / YJLV</span>
      <span class="pill">YH 焊把线</span>
      <span class="pill">RVV / RVS / VAF</span>
    </div>
    <div class="cta">立即询价 →</div>
  </div>
</div>
</body>
</html>
