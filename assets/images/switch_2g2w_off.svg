<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eedcbe"/>
      <stop offset="1" stop-color="#cbb28c"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf1e4"/>
      <stop offset="1" stop-color="#dec5a4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="11" width="118" height="108" rx="8" fill="url(#case)" stroke="#a38b63" stroke-width="1.5"/>
  <rect x="5" y="15" width="110" height="100" rx="6" fill="none" stroke="#b8a078" stroke-width="1"/>
  <rect x="9" y="19" width="102" height="92" rx="4" fill="url(#inner)" stroke="#b8a078" stroke-width="1"/>
  <!-- COM 端 -->
  <line x1="60" y1="1" x2="60" y2="30" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="30" r="3" fill="#dc2626"/>
  <!-- 拨杆: 居中悬空,既不接 L1 也不接 L2 (OFF 状态) -->
  <line x1="60" y1="30" x2="60" y2="62" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <!-- L1/L2 触点都断开(都红色,无引线连) -->
  <circle cx="32" cy="72" r="4" fill="#dc2626"/>
  <circle cx="88" cy="72" r="4" fill="#dc2626"/>
  <line x1="32" y1="75" x2="32" y2="113" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="75" x2="88" y2="113" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <text x="60" y="8" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#78350f">COM</text>
  <text x="32" y="125" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#dc2626">L1</text>
  <text x="88" y="125" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#dc2626">L2</text>
</svg>
