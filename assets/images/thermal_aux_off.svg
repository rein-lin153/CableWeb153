<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="68" height="88" rx="6" fill="url(#case)" stroke="#475569" stroke-width="2"/>
  <rect x="10" y="10" width="60" height="80" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 热继电器符号: 双金属片(斜线) + 加热 -->
  <rect x="20" y="24" width="40" height="18" rx="2" fill="#fff" stroke="#b45309" stroke-width="1.6"/>
  <line x1="22" y1="40" x2="58" y2="26" stroke="#b45309" stroke-width="1.4"/>
  <text x="40" y="36" text-anchor="middle" font-family="Arial" font-size="8" fill="#b45309" font-weight="700">FR</text>
  <!-- NC 辅助触点(常态闭合 95-96) -->
  <line x1="12" y1="88" x2="12" y2="52" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="52" x2="68" y2="52" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="52" x2="68" y2="52" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="52" x2="68" y2="88" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="52" r="2" fill="#dc2626"/>
  <circle cx="68" cy="52" r="2" fill="#dc2626"/>
  <!-- 热继动断符号: 触点上小方块 -->
  <rect x="52" y="48" width="6" height="8" fill="#16a34a" stroke="#166534" stroke-width="0.8"/>
  <text x="12" y="97" text-anchor="middle" font-family="Arial" font-size="7" fill="#475569" font-weight="700">95</text>
  <text x="68" y="97" text-anchor="middle" font-family="Arial" font-size="7" fill="#475569" font-weight="700">96</text>
</svg>
