<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <!-- 熔断器外壳(圆柱形) -->
  <rect x="20" y="20" width="40" height="80" rx="20" fill="url(#body)" stroke="#78350f" stroke-width="2"/>
  <!-- 陶瓷管两端 -->
  <rect x="22" y="22" width="36" height="14" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <rect x="22" y="84" width="36" height="14" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <!-- 熔体(石英管内的熔丝,完好) — IEC 符号:长方形 -->
  <rect x="32" y="36" width="16" height="48" rx="2" fill="#fef3c7" stroke="#a16207" stroke-width="1.2"/>
  <!-- 熔丝线(完好: 绿) -->
  <line x1="40" y1="36" x2="40" y2="84" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <!-- FU 标识 -->
  <text x="58" y="64" text-anchor="start" font-family="Arial" font-size="10" font-weight="700" fill="#78350f">FU</text>
  <!-- 端子 -->
  <line x1="40" y1="8" x2="40" y2="22" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#dc2626" font-weight="700">L</text>
  <line x1="40" y1="98" x2="40" y2="113" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="119" text-anchor="middle" font-family="Arial" font-size="7" fill="#dc2626" font-weight="700">L</text>
</svg>
