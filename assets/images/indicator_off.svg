<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- 外壳 -->
  <rect x="8" y="18" width="64" height="84" rx="6" fill="url(#case)" stroke="#475569" stroke-width="2"/>
  <rect x="12" y="22" width="56" height="76" rx="4" fill="#334155" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 灯罩(熄灭: 深灰) -->
  <circle cx="40" cy="60" r="22" fill="#1f2937" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="40" cy="60" r="16" fill="#374151"/>
  <!-- 文字 HL(指示灯国标符号) -->
  <text x="40" y="64" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#94a3b8">HL</text>
  <!-- 端子引线: 上 L 下 N -->
  <line x1="22" y1="8" x2="22" y2="22" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="22" y="6" text-anchor="middle" font-family="Arial" font-size="7" fill="#dc2626" font-weight="700">L</text>
  <line x1="58" y1="100" x2="58" y2="114" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="58" y="118" text-anchor="middle" font-family="Arial" font-size="7" fill="#3b82f6" font-weight="700">N</text>
</svg>
