<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 110">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- DIN 导轨底座 -->
  <rect x="2" y="100" width="80" height="7" rx="2" fill="#9ca3af" stroke="#6b7280" stroke-width="0.9"/>
  <!-- 4 个并排端子极(每极 ~18 宽),导电片竖直贯通顶+底螺丝 -->
  <g>
    <!-- pole1 -->
    <rect x="3" y="6" width="18" height="92" rx="2.5" fill="url(#body)" stroke="#475569" stroke-width="1"/>
    <rect x="6" y="9" width="12" height="86" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>
    <circle cx="12" cy="16" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="12" cy="16" r="1.4" fill="#334155"/>
    <line x1="12" y1="20" x2="12" y2="86" stroke="#9ca3af" stroke-width="1.4"/>
    <circle cx="12" cy="90" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="12" cy="90" r="1.4" fill="#334155"/>
    <text x="12" y="57" text-anchor="middle" font-family="Arial" font-size="5" fill="#64748b" font-weight="700">1</text>
    <!-- pole2 -->
    <rect x="23" y="6" width="18" height="92" rx="2.5" fill="url(#body)" stroke="#475569" stroke-width="1"/>
    <rect x="26" y="9" width="12" height="86" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>
    <circle cx="32" cy="16" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="32" cy="16" r="1.4" fill="#334155"/>
    <line x1="32" y1="20" x2="32" y2="86" stroke="#9ca3af" stroke-width="1.4"/>
    <circle cx="32" cy="90" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="32" cy="90" r="1.4" fill="#334155"/>
    <text x="32" y="57" text-anchor="middle" font-family="Arial" font-size="5" fill="#64748b" font-weight="700">2</text>
    <!-- pole3 -->
    <rect x="43" y="6" width="18" height="92" rx="2.5" fill="url(#body)" stroke="#475569" stroke-width="1"/>
    <rect x="46" y="9" width="12" height="86" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>
    <circle cx="52" cy="16" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="52" cy="16" r="1.4" fill="#334155"/>
    <line x1="52" y1="20" x2="52" y2="86" stroke="#9ca3af" stroke-width="1.4"/>
    <circle cx="52" cy="90" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="52" cy="90" r="1.4" fill="#334155"/>
    <text x="52" y="57" text-anchor="middle" font-family="Arial" font-size="5" fill="#64748b" font-weight="700">3</text>
    <!-- pole4 -->
    <rect x="63" y="6" width="18" height="92" rx="2.5" fill="url(#body)" stroke="#475569" stroke-width="1"/>
    <rect x="66" y="9" width="12" height="86" rx="1.5" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>
    <circle cx="72" cy="16" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="72" cy="16" r="1.4" fill="#334155"/>
    <line x1="72" y1="20" x2="72" y2="86" stroke="#9ca3af" stroke-width="1.4"/>
    <circle cx="72" cy="90" r="4" fill="url(#metal)" stroke="#64748b" stroke-width="0.6"/>
    <circle cx="72" cy="90" r="1.4" fill="#334155"/>
    <text x="72" y="57" text-anchor="middle" font-family="Arial" font-size="5" fill="#64748b" font-weight="700">4</text>
  </g>
  <!-- 顶部公共排标识 + XT 标签 -->
  <text x="42" y="4" text-anchor="middle" font-family="Arial" font-size="5.5" fill="#475569" font-weight="700">XT</text>
</svg>
