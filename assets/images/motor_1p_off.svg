<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
  </defs>
  <!-- 电机外壳(圆柱) -->
  <circle cx="50" cy="60" r="38" fill="url(#body)" stroke="#374151" stroke-width="2"/>
  <circle cx="50" cy="60" r="30" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  <!-- 散热翅片(径向短线) -->
  <g stroke="#4b5563" stroke-width="1">
    <line x1="50" y1="22" x2="50" y2="30"/>
    <line x1="50" y1="90" x2="50" y2="98"/>
    <line x1="12" y1="60" x2="20" y2="60"/>
    <line x1="80" y1="60" x2="88" y2="60"/>
    <line x1="23" y1="33" x2="29" y2="39"/>
    <line x1="71" y1="33" x2="77" y2="39"/>
    <line x1="23" y1="87" x2="29" y2="81"/>
    <line x1="71" y1="87" x2="77" y2="81"/>
  </g>
  <!-- M 字母(电机) -->
  <text x="50" y="64" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1f2937">M</text>
  <text x="80" y="100" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#374151">~</text>
  <!-- 端子: L(顶部) N(底部) — 单相 -->
  <line x1="34" y1="8" x2="34" y2="24" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="6" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#dc2626">L</text>
  <line x1="66" y1="8" x2="66" y2="24" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <text x="66" y="6" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="#3b82f6">N</text>
</svg>
