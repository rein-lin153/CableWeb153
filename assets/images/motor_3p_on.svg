<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="mb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <!-- 运转高亮 -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 运转光晕 -->
  <circle cx="70" cy="70" r="46" fill="url(#glow)"/>
  <rect x="20" y="20" width="100" height="100" rx="14" fill="url(#mb)" stroke="#1e3a8a" stroke-width="2"/>
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.6">
    <line x1="28" y1="30" x2="112" y2="30"/>
    <line x1="28" y1="40" x2="112" y2="40"/>
    <line x1="28" y1="50" x2="112" y2="50"/>
    <line x1="28" y1="92" x2="112" y2="92"/>
    <line x1="28" y1="102" x2="112" y2="102"/>
    <line x1="28" y1="112" x2="112" y2="112"/>
  </g>
  <circle cx="70" cy="70" r="30" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="24" fill="#fff" stroke="#a16207" stroke-width="1"/>
  <!-- 旋转风扇叶(SMIL 自驱,不占主线程) -->
  <g>
    <g fill="#475569" stroke="#1e293b" stroke-width="0.8">
      <path d="M70 46 L74 70 L70 70 Z"/>
      <path d="M94 70 L70 74 L70 70 Z"/>
      <path d="M70 94 L66 70 L70 70 Z"/>
      <path d="M46 70 L70 66 L70 70 Z"/>
    </g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 70 70" to="360 70 70" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <circle cx="70" cy="70" r="4" fill="#1e293b"/>
  <text x="104" y="118" font-family="Arial" font-size="12" fill="#fde68a" font-weight="700">M</text>
  <text x="36" y="118" font-family="Arial" font-size="7" fill="#fde68a" font-weight="700">3~</text>
  <line x1="25" y1="125" x2="25" y2="132" stroke="#eab308" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="25" cy="125" r="2.6" fill="#eab308"/>
  <line x1="70" y1="125" x2="70" y2="132" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="70" cy="125" r="2.6" fill="#22c55e"/>
  <line x1="115" y1="125" x2="115" y2="132" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="115" cy="125" r="2.6" fill="#ef4444"/>
  <text x="25" y="139" text-anchor="middle" font-family="Arial" font-size="7" fill="#e2e8f0" font-weight="700">U</text>
  <text x="70" y="139" text-anchor="middle" font-family="Arial" font-size="7" fill="#e2e8f0" font-weight="700">V</text>
  <text x="115" y="139" text-anchor="middle" font-family="Arial" font-size="7" fill="#e2e8f0" font-weight="700">W</text>
</svg>
