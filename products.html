  <script>
    // ============================================================
    // 数据源：localStorage → /api → data/*.json fallback
    // CATEGORIES 为组装后的嵌套结构（分类 + 其下 products[]）
    // ============================================================
    var STORAGE_KEY_CATEGORIES = 'bw_cable_categories';
    var STORAGE_KEY_PRODUCTS = 'bw_cable_products';

    var CATEGORIES = [];        // 组装后：[{.., products:[..]}]
    var CAT_SOURCE = [];         // 扁平分类
    var PROD_SOURCE = [];        // 扁平产品
    var DATA_READY = false;

    function catById(id) {
      for (var i = 0; i < CAT_SOURCE.length; i++) { if (CAT_SOURCE[i].id === id) return CAT_SOURCE[i]; }
      return null;
    }

    function reorderSource(arr) {
      return arr.slice().sort(function (a, b) {
        var ao = Number(a.order), bo = Number(b.order);
        if (isNaN(ao)) ao = 9999; if (isNaN(bo)) bo = 9999;
        return ao - bo;
      });
    }

    // 把扁平 categories + products 组装成嵌套 CATEGORIES
    function assembleCategories(cats, prods) {
      var sortedCats = reorderSource(cats);
      var nested = [];
      for (var i = 0; i < sortedCats.length; i++) {
        var c = sortedCats[i];
        var cProducts = prods
          .filter(function (p) { return p.categoryId === c.id; })

      if (localCats && localCats.length) {
        applyData(localCats, localProds || []);
        onReady();
      }

      // 2) /api 远程（权威源）
      Promise.all([
        fetch('/api/categories').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch('/api/products').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (res) {
        var rc = res[0], rp = res[1];
        if (Array.isArray(rc) && rc.length) {
          applyData(rc, Array.isArray(rp) ? rp : []);
          onReady();
          return;
        }
        // 3) 静态 json fallback（KV 不可用且无本地缓存时）
        if (!DATA_READY) {
          Promise.all([
            fetch('data/categories.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
            fetch('data/products.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })

            applyData(s[0] || [], s[1] || []);

          });
        }
      });
