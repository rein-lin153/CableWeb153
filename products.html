    var CATEGORIES = [];        // 组装后：[{.., products:[..]}]
    var CAT_SOURCE = [];         // 扁平分类
    var PROD_SOURCE = [];        // 扁平产品
    var DATA_READY = false;

    function catById(id) {
      for (var i = 0; i < CAT_SOURCE.length; i++) { if (CAT_SOURCE[i].id === id) return CAT_SOURCE[i]; }
      return null;
    }

    function reorderSource(arr) {
      return arr.slice().sort(function (a, b) {
        var ao = Number(a.order), bo = Number(b.order);
        if (isNaN(ao)) ao = 9999; if (isNaN(bo)) bo = 9999;
        return ao - bo;
      });
    }

    // 把扁平 categories + products 组装成嵌套 CATEGORIES
    function assembleCategories(cats, prods) {
      var sortedCats = reorderSource(cats);
      var nested = [];
      for (var i = 0; i < sortedCats.length; i++) {
        var c = sortedCats[i];
        var cProducts = prods
          .filter(function (p) { return p.categoryId === c.id; })
          .sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
        nested.push({
          id: c.id,
          title: c.title, label: c.label,
          // 多语言字段透传（categories.json 新增）：
          label_en: c.label_en || '',
          label_km: c.label_km || '',   // 一般留空，km 时用 title
          desc: c.desc, desc_km: c.desc_km || '', desc_en: c.desc_en || '',
          color: c.color, icon: c.icon, img: c.img, order: c.order,
          products: cProducts
        });
      }
      return nested;
    }

    function tryParseStored(key) {
      try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (_) { return null; }
    }

    function applyData(cats, prods) {
      CAT_SOURCE = Array.isArray(cats) ? cats : [];
      PROD_SOURCE = Array.isArray(prods) ? prods : [];
      CATEGORIES = assembleCategories(CAT_SOURCE, PROD_SOURCE);
      localStorage.setItem(STORAGE_KEY_CATEGORIES, JSON.stringify(CAT_SOURCE));
      localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(PROD_SOURCE));
    }

    function onReady() {
      DATA_READY = true;
      renderFilterPills();
      renderCategories();
      initFromHash();
      console.log('products ready, CATEGORIES count:', CATEGORIES.length, 'products:', PROD_SOURCE.length);
    }

    // 渲染顶部 filter pills（动态，基于 CATEGORIES）
    function renderFilterPills() {
      var box = document.getElementById('category-filters');
      if (!box) return;
      var html = '<button class="filter-pill active px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-950 shadow-lg" data-cat="all">' + __I18N__.t('products.section.filter_all') + '</button>';
      for (var i = 0; i < CATEGORIES.length; i++) {
        var c = CATEGORIES[i];
        html += '<button class="filter-pill px-4 py-2 rounded-xl text-sm font-semibold bg-slate-200 text-slate-700 font-bold hover:bg-slate-300" data-cat="' + esc(c.id) + '">' + esc(L(c, 'label')) + '</button>';
      }
      box.innerHTML = html;
    }

    // 一次性自愈：heuristic 判断 cats/prods 是否缺失多语言字段（早期 KV/admin 写入的
    // 数据没有 label_en/label_km 等，导致 L() 在 km/en 下回退到中文 → 切语言卡片不变）。
    // 判定任一为真即视为陈旧，返回 true 让 loadData 清缓存改走 inline + data/*.json。
    function isStaleSource(cats, prods) {
      if (!Array.isArray(prods) || !prods.length) return true;
      var hasEn = false, hasKm = false;
      for (var i = 0; i < prods.length && !(hasEn && hasKm); i++) {
        if (prods[i] && prods[i].label_en) hasEn = true;
        if (prods[i] && prods[i].label_km) hasKm = true;
      }
      if (!hasEn && !hasKm) return true;             // 产品完全缺多语言字段
      if (Array.isArray(cats)) {
        for (var j = 0; j < cats.length; j++) {
          if (cats[j] && /^cat\d+$/.test(String(cats[j].id))) return true; // 旧 admin 数字 id
        }
      }
      return false;
    }

    // 初始化加载：三级 fallback（DOMContentLoaded 后执行，确保 esc/renderCategories 等已定义）
    document.addEventListener('DOMContentLoaded', function loadData() {
      var localCats = tryParseStored(STORAGE_KEY_CATEGORIES);
      var localProds = tryParseStored(STORAGE_KEY_PRODUCTS);

      // 自愈：清掉缺多语言字段的陈旧 localStorage（旧 KV/admin 写入），避免黏住错误数据
      if (localCats && localProds && isStaleSource(localCats, localProds)) {
        try { localStorage.removeItem(STORAGE_KEY_CATEGORIES); localStorage.removeItem(STORAGE_KEY_PRODUCTS); } catch (_) {}
        localCats = null; localProds = null;
      }

      // 1) localStorage 快速渲染
      if (localCats && localCats.length) {
        applyData(localCats, localProds || []);
        onReady();
      } else if (INLINE_CATEGORIES.length) {
        // 0) 首屏免等待：localStorage 未命中时先用内联数据立即渲染，
        //    让爬虫与首屏在 fetch 返回前就能看到产品（权威数据到达后覆盖）。
        //    INLINE_* 现已与 data/*.json 同步、含 _en/_km 字段。
        applyData(INLINE_CATEGORIES, INLINE_PRODUCTS);
        onReady();
      }

      // 2) /api 远程（权威源）
      Promise.all([
        fetch('/api/categories').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch('/api/products').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (res) {
        var rc = res[0], rp = res[1];
        // /api 返回可信（数组非空）才采用；否则走 data/*.json 兜底
        if (Array.isArray(rc) && rc.length && !isStaleSource(rc, Array.isArray(rp) ? rp : [])) {
          applyData(rc, Array.isArray(rp) ? rp : []);
          onReady();
          return;
        }
        // 3) 静态 json fallback：/api 不可用或陈旧时，无条件加载 data/*.json
        //    （现含多语言字段）覆盖 inline 首屏快照。不再用 DATA_READY 门判断，
        //    否则 inline 触发过 onReady() 后静态兜底会被死锁跳过。
        Promise.all([
          fetch('data/categories.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
          fetch('data/products.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
        ]).then(function (s) {
          applyData(s[0] || [], s[1] || []);
          onReady();
        });
      });
    });


    var FALLBACK_IMG = 'https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?q=80&w=800&auto=format&fit=crop';

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function nl(s) { return s ? esc(s).replace(/\n/g, '<br>') : ''; }

    // 多语言字段选择器 (products.html 局部)。
    // 用法: L(obj, 'label') → obj.label / obj.label_km / obj.label_en 之一
    //   obj 为 flatten 数据源元素 (CAT_SOURCE / PROD_SOURCE / INLINE_* / 嵌套对象)。
    // 约定: 高棉语优先用 {field}_km，否则类别用 title（已是 km），否则回退中文 {field}；
    //       英文用 {field}_en，否则回退中文 {field}。
    // 这一步让产品/分类卡片在不同语言下显示本地化的 label/desc/usage 等。
    function L(obj, field) {
      if (!obj) return '';
      var lang = (window.__I18N__ && window.__I18N__.lang) || 'km';
      if (lang === 'km') {
        var km = obj[field + '_km'];
        if (km) return km;
        // 类别 label 高棉语等同于 title（categories.json 的 title 即 km）
        if (field === 'label' && obj.title) return obj.title;
      } else if (lang === 'en') {
        var en = obj[field + '_en'];
        if (en) return en;
      }
      return obj[field] != null ? obj[field] : '';
    }

    function colorClasses(name) {
      var map = {
        amber: { pill: 'bg-amber-100 text-amber-700', outline: 'border-amber-300', hover: 'hover:border-amber-500', accent: 'text-amber-700', bg: 'from-amber-100 to-amber-200' },
        rose: { pill: 'bg-rose-100 text-rose-700', outline: 'border-rose-300', hover: 'hover:border-rose-500', accent: 'text-rose-700', bg: 'from-rose-100 to-rose-200' },
        slate: { pill: 'bg-slate-100 text-slate-700', outline: 'border-slate-400', hover: 'hover:border-slate-500', accent: 'text-slate-700', bg: 'from-slate-200 to-slate-300' },
        emerald: { pill: 'bg-emerald-100 text-emerald-700', outline: 'border-emerald-300', hover: 'hover:border-emerald-500', accent: 'text-emerald-700', bg: 'from-emerald-100 to-teal-200' }
      };
      return map[name] || map.slate;
    }

    function matchesQuery(text, q) { return text.toLowerCase().indexOf(q.toLowerCase()) > -1; }

    function renderCategories() {
      var grid = document.getElementById('categories-grid');
      var q = document.getElementById('product-search').value.trim();
      var activePill = document.querySelector('#category-filters .filter-pill.active');
      var activeCat = activePill ? activePill.dataset.cat : 'all';
      var anyVisible = false;
      var html = '';
      for (var ci = 0; ci < CATEGORIES.length; ci++) {
        var cat = CATEGORIES[ci];
        var c = colorClasses(cat.color);
        var out = [];
        for (var pi = 0; pi < cat.products.length; pi++) {
          var p = cat.products[pi];
          var text = p.name + ' ' + p.label + ' ' + (p.label_km || '') + ' ' + (p.label_en || '') + ' ' + cat.label + ' ' + cat.title + ' ' + cat.desc + ' ' + (cat.desc_km || '') + ' ' + (cat.desc_en || '') + ' ' + (p.usage || '') + ' ' + (p.usage_km || '') + ' ' + (p.usage_en || '');
          var qOk = !q || matchesQuery(text, q);
          var catOk = activeCat === 'all' || cat.id === activeCat;
          if (qOk && catOk) out.push(p);
        }
        if (out.length === 0) continue;
        anyVisible = true;
        var buttons = '';
        for (var bi = 0; bi < out.length; bi++) {
          var p = out[bi];
          buttons += '<button data-cat="' + cat.id + '" data-pid="' + p.id + '" type="button" class="w-full text-left border-2 ' + c.outline + ' rounded-xl p-3 flex gap-3 items-center bg-white hover:bg-slate-50 transition group"><div class="h-20 w-24 rounded-lg bg-slate-200 overflow-hidden shrink-0 border border-slate-200 pointer-events-none"><img src="' + p.img + '" alt="" class="w-full h-full object-cover" loading="lazy" draggable="false"></div><div class="min-w-0"><div class="text-xs font-black ' + c.accent + ' truncate group-hover:underline">' + esc(p.name) + ' <span class="font-semibold text-slate-600">/ ' + esc(L(p, 'label')) + '</span></div><div class="text-[11px] text-slate-600 mt-1 line-clamp-2">' + nl(L(p, 'usage')) + '</div><span class="inline-block mt-2 text-[10px] font-black text-slate-900 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded">' + __I18N__.t('products.section.view_details') + '</span></div></button>';
        }
        html += '<article class="card-hover bg-white border-2 ' + c.outline + ' rounded-2xl shadow-md overflow-hidden flex flex-col ' + c.hover + '"><div class="h-36 bg-gradient-to-br ' + c.bg + ' relative"><div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid ' + cat.icon + ' text-5xl opacity-60"></i></div><span class="absolute top-3 left-3 px-2.5 py-1 bg-white/85 backdrop-blur text-slate-900 text-xs font-black rounded-full border ' + c.outline + '">' + esc(L(cat, 'label')) + '</span><span class="absolute top-3 right-3 px-2 py-1 bg-slate-900/70 backdrop-blur text-white text-[10px] font-black rounded-full">' + out.length + ' ' + __I18N__.t('products.section.spec_count') + '</span></div><div class="p-5 flex-1 flex flex-col"><h3 class="font-black text-slate-900 text-base mb-0.5">' + esc(L(cat, 'title')) + '</h3><p class="text-xs text-slate-500 mb-3 font-semibold">' + esc(L(cat, 'label')) + '</p><p class="text-sm text-slate-600 leading-relaxed mb-4">' + esc(L(cat, 'desc')) + '</p><div class="mt-auto grid grid-cols-1 gap-3">' + buttons + '</div></div></article>';
      }
      grid.innerHTML = html;
      document.getElementById('search-empty').classList.toggle('hidden', anyVisible);
    }

    function findProduct(catId, prodId) {
      for (var i = 0; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].id !== catId) continue;
        for (var j = 0; j < CATEGORIES[i].products.length; j++) {
          if (CATEGORIES[i].products[j].id === prodId) return [CATEGORIES[i], CATEGORIES[i].products[j]];
        }
      }
      return [null, null];
    }

    var modal = document.getElementById('product-modal');
    var currentProduct = null;

    // 1. 修改卡片点击事件代理（添加 e.preventDefault() 和 e.stopPropagation()）
    document.getElementById('categories-grid').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-cat][data-pid]');
      if (btn) {
        e.preventDefault(); // 阻止默认行为，防止浏览器误将图片打开
        e.stopPropagation(); // 阻止冒泡
        openProduct(btn.dataset.cat, btn.dataset.pid);
      }
    });
    // 图片加载失败时隐藏碎裂图标（error 事件不冒泡，需用捕获阶段）
    document.getElementById('categories-grid').addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'IMG') { t.style.visibility = 'hidden'; }
    }, true);
    window.openProduct = function (catId, prodId) {
      try {
        var pair = findProduct(catId, prodId);
        var cat = pair[0]; var p = pair[1];
        console.log('openProduct', catId, prodId, 'found?', !!(p && p.name), p && p.name);
        if (!p || !p.name) { console.warn('openProduct missing', catId, prodId); return; }
        currentProduct = p;
        var vel = document.getElementById('product-modal-voltage');
        var ids = ['product-modal-img', 'product-modal-badge', 'product-modal-category', 'product-modal-title', 'product-modal-sub', 'product-modal-tag', 'product-modal-voltage', 'product-modal-conductor', 'product-modal-insulation', 'product-modal-sheath', 'product-modal-temp', 'product-modal-install', 'product-modal-usage', 'product-modal-features', 'product-modal-standard', 'product-modal-packaging', 'product-modal-radius'];
        var missing = ids.filter(function (id) { return !document.getElementById(id); });
        if (missing.length) { console.error('missing modal fields', missing); }
        document.getElementById('product-modal-img').src = p.img;
        document.getElementById('product-modal-img').onerror = function () { this.style.opacity = '0.3'; };
        document.getElementById('product-modal-badge').textContent = p.name + ' · ' + (cat ? L(cat, 'label') : '');
        document.getElementById('product-modal-category').textContent = cat ? L(cat, 'title') : '';
        document.getElementById('product-modal-title').textContent = p.name;
        document.getElementById('product-modal-sub').textContent = L(p, 'label');
        document.getElementById('product-modal-tag').textContent = cat && cat.icon ? cat.icon + ' ' + L(cat, 'label') : '';
        vel.textContent = nl(p.voltage);
        document.getElementById('product-modal-conductor').textContent = nl(p.conductor);
        document.getElementById('product-modal-insulation').textContent = nl(p.insulation);
        document.getElementById('product-modal-sheath').textContent = nl(p.sheath);
        document.getElementById('product-modal-temp').textContent = nl(p.temp);
        document.getElementById('product-modal-install').textContent = nl(p.install);
        document.getElementById('product-modal-usage').textContent = nl(L(p, 'usage'));
        document.getElementById('product-modal-features').textContent = nl(L(p, 'features'));
        document.getElementById('product-modal-standard').textContent = nl(p.standard);
        document.getElementById('product-modal-packaging').textContent = nl(L(p, 'packaging'));
        document.getElementById('product-modal-radius').textContent = nl(p.radius);
        // 新增区块：规格截面表 / 敷设 / 选型 / 派生型号 / 数据说明
        var tbl = document.getElementById('product-modal-specs-table');
        tbl.innerHTML = '';
        if (p.specs && p.specs.length) {
          document.getElementById('product-modal-specs-wrap').classList.remove('hidden');
          // 动态表头：默认 5 列；若某行有 6 列则用电力类表头
          var ncols = p.specs[0].length;
          var headers = p.specHeaders || (ncols >= 6
            ? [__I18N__.t('modal.product.spec_header.spec'), __I18N__.t('modal.product.spec_header.conductor_structure'), __I18N__.t('modal.product.spec_header.outer_diameter'), __I18N__.t('modal.product.spec_header.reference_weight'), __I18N__.t('modal.product.spec_header.ampacity_air'), __I18N__.t('modal.product.spec_header.ampacity_buried')]
            : [__I18N__.t('modal.product.spec_header.spec'), __I18N__.t('modal.product.spec_header.conductor_structure'), __I18N__.t('modal.product.spec_header.outer_diameter'), __I18N__.t('modal.product.spec_header.reference_weight'), __I18N__.t('modal.product.spec_header.reference_ampacity')]);
          var thead = document.createElement('thead');
          thead.className = 'bg-slate-100 text-slate-600';
          var htr = document.createElement('tr');
          for (var hi = 0; hi < headers.length; hi++) {
            var th = document.createElement('th');
            th.className = 'px-2.5 py-2 text-left font-black whitespace-nowrap';
            th.textContent = headers[hi];
            htr.appendChild(th);
          }
          thead.appendChild(htr); tbl.appendChild(thead);
          var tbody = document.createElement('tbody');
          tbody.className = 'divide-y divide-slate-100';
          for (var si = 0; si < p.specs.length; si++) {
            var row = p.specs[si];
            var tr = document.createElement('tr');
            tr.className = si % 2 ? 'bg-slate-50/60' : '';
            for (var ci = 0; ci < row.length; ci++) {
              var td = document.createElement('td');
              td.className = 'px-2.5 py-1.5 whitespace-nowrap';
              if (ci === 0) { td.className += ' font-black text-slate-900'; td.textContent = row[ci]; }
              else if (ci === row.length - 1) { td.className += ' text-amber-700 font-bold'; td.textContent = row[ci]; }
              else { td.className += ' text-slate-600'; td.textContent = row[ci]; }
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          tbl.appendChild(tbody);
        } else { document.getElementById('product-modal-specs-wrap').classList.add('hidden'); }

        function toggleTextBlock(wrapId, textId, val) {
          var w = document.getElementById(wrapId), el = document.getElementById(textId);
          if (val) { w.classList.remove('hidden'); el.innerHTML = nl(val); } else { w.classList.add('hidden'); }
        }
        toggleTextBlock('product-modal-installation-wrap', 'product-modal-installation', L(p, 'installation'));
        toggleTextBlock('product-modal-selection-wrap', 'product-modal-selection', L(p, 'selection'));

        var vWrap = document.getElementById('product-modal-variants-wrap');
        var vBox = document.getElementById('product-modal-variants');
        vBox.innerHTML = '';
        // variants 为字符串数组；km/en 翻译写入 variants_km/variants_en（数组），按当前语言取本地化数组，回退到原 variants
        var localizedVariants = (function () {
          var lang = (window.__I18N__ && window.__I18N__.lang) || 'km';
          if (lang === 'km' && p.variants_km) return p.variants_km;
          if (lang === 'en' && p.variants_en) return p.variants_en;
          return p.variants || [];
        })();
        if (localizedVariants && localizedVariants.length) {
          vWrap.classList.remove('hidden');
          for (var vi = 0; vi < localizedVariants.length; vi++) {
            var chip = document.createElement('span');
            chip.className = 'px-2 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-[10px] font-bold rounded-md';
            chip.textContent = localizedVariants[vi];
            vBox.appendChild(chip);
          }
        } else { vWrap.classList.add('hidden'); }

        document.getElementById('product-modal-note').textContent = L(p, 'note') || '';
        modal.classList.remove('hidden'); modal.classList.add('flex');
        requestAnimationFrame(function () { modal.classList.add('open'); });
        document.body.style.overflow = 'hidden';
      } catch (err) { console.error('openProduct error', err); }
    };

    window.closeProductModal = function () {
      modal.classList.remove('open');
      setTimeout(function () { modal.classList.add('hidden'); modal.classList.remove('flex'); document.body.style.overflow = ''; }, 250);
    };

    window.copySpec = function () {
      if (!currentProduct) return;
      var p = currentProduct;
      var lines = [p.name + ' | ' + L(p, 'label'), __I18N__.t('modal.product.voltage') + ': ' + p.voltage, __I18N__.t('modal.product.conductor') + ': ' + p.conductor, __I18N__.t('modal.product.insulation') + ': ' + p.insulation, __I18N__.t('modal.product.sheath') + ': ' + p.sheath, __I18N__.t('modal.product.temp') + ': ' + p.temp, __I18N__.t('modal.product.install') + ': ' + p.install, __I18N__.t('modal.product.radius') + ': ' + p.radius, __I18N__.t('modal.product.usage') + ': ' + L(p, 'usage'), __I18N__.t('modal.product.features') + ': ' + L(p, 'features'), __I18N__.t('modal.product.standard') + ': ' + p.standard, __I18N__.t('modal.product.packaging') + ': ' + L(p, 'packaging')];
      if (p.specs && p.specs.length) {
        lines.push('');
        lines.push(__I18N__.t('modal.product.spec_table') + ':');
        lines.push(__I18N__.t('modal.product.spec_header.spec') + ' | ' + __I18N__.t('modal.product.spec_header.conductor_structure') + ' | ' + __I18N__.t('modal.product.spec_header.outer_diameter') + ' | ' + __I18N__.t('modal.product.spec_header.reference_weight') + ' | ' + __I18N__.t('modal.product.spec_header.reference_ampacity'));
        for (var i = 0; i < p.specs.length; i++) { lines.push(p.specs[i].join(' | ')); }
      }
      var instLoc = L(p, 'installation');
      var selLoc = L(p, 'selection');
      var varLoc = (function () {
        var lang = (window.__I18N__ && window.__I18N__.lang) || 'km';
        if (lang === 'km' && p.variants_km) return p.variants_km;
        if (lang === 'en' && p.variants_en) return p.variants_en;
        return p.variants || [];
      })();
      if (instLoc) lines.push('', __I18N__.t('modal.product.installation') + ': ' + instLoc);
      if (selLoc) lines.push('', __I18N__.t('modal.product.selection') + ': ' + selLoc);
      if (varLoc && varLoc.length) lines.push('', __I18N__.t('modal.product.variants') + ': ' + varLoc.join('、'));
      if (L(p, 'note')) lines.push('', L(p, 'note'));
      var text = lines.join('\\n');
      if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function () { alert(__I18N__.t('modal.product.copied')); }); }
    };

    modal.addEventListener('click', function (e) { if (e.target === modal) closeProductModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeProductModal(); });

    document.getElementById('product-search').addEventListener('input', renderCategories);
    document.getElementById('category-filters').addEventListener('click', function (e) {
      var pill = e.target.closest('.filter-pill');
      if (!pill) return;
      var pills = document.querySelectorAll('#category-filters .filter-pill');
      for (var i = 0; i < pills.length; i++) { pills[i].classList.remove('active', 'bg-amber-500', 'text-slate-950', 'shadow-lg'); pills[i].classList.add('bg-slate-200', 'text-slate-700', 'font-bold', 'hover:bg-slate-300'); }
      pill.classList.add('active', 'bg-amber-500', 'text-slate-950', 'shadow-lg');
      pill.classList.remove('bg-slate-200', 'text-slate-700', 'font-bold', 'hover:bg-slate-300');
      renderCategories();
    });

    // 处理 URL hash (来自首页点击) —— 激活对应分类并滚动到网格（由 onReady 在数据就绪后调用）
    function initFromHash() {
        var hash = window.location.hash.replace('#', '');
        var validIds = CATEGORIES.map(function (c) { return c.id; });
        if (hash && validIds.indexOf(hash) > -1) {
            var targetPill = document.querySelector('#category-filters .filter-pill[data-cat="' + hash + '"]');
            if (targetPill) {
                var pills = document.querySelectorAll('#category-filters .filter-pill');
                for (var i = 0; i < pills.length; i++) {
                    pills[i].classList.remove('active', 'bg-amber-500', 'text-slate-950', 'shadow-lg');
                    pills[i].classList.add('bg-slate-200', 'text-slate-700', 'font-bold', 'hover:bg-slate-300');
                }
                targetPill.classList.add('active', 'bg-amber-500', 'text-slate-950', 'shadow-lg');
                targetPill.classList.remove('bg-slate-200', 'text-slate-700', 'font-bold', 'hover:bg-slate-300');
            }
            var grid = document.getElementById('categories-grid');
            if (grid) {
                setTimeout(function() { grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
            }
        }
    }

    // 语言切换实时重渲染：i18n.js set() 触发 'i18n:langchange'。产品卡片/筛选 pill
    // 的文本由 L(obj,field) 取 __I18N__.lang 决定，页面静态 data-i18n 由 apply() 自动更新，
    // 但 JS 渲染的卡片需要手动重画。切语言后保持当前激活分类与搜索词不变。
    window.addEventListener('i18n:langchange', function () {
        if (!DATA_READY) return;
        // 保留当前激活的筛选 pill（重画 pill 时丢失 active 指示，需复用）
        var activePill = document.querySelector('#category-filters .filter-pill.active');
        var activeCat = activePill ? activePill.dataset.cat : 'all';
        renderFilterPills();
        if (activeCat && activeCat !== 'all') {
            var p = document.querySelector('#category-filters .filter-pill[data-cat="' + activeCat + '"]');
            if (p) {
                p.classList.add('active', 'bg-amber-500', 'text-slate-950', 'shadow-lg');
                p.classList.remove('bg-slate-200', 'text-slate-700', 'font-bold', 'hover:bg-slate-300');
            }
        }
        renderCategories();
        // 若当前已打开产品弹窗，也用新语言刷新其内部文本（重新调用 openProduct）
        if (currentProduct) {
            try { openProduct(currentProduct.categoryId, currentProduct.id); } catch (_) {}
        }
    });

    document.getElementById('contact-modal')?.addEventListener('click', function (e) { if (e.target.id === 'contact-modal') closeContactModal(); });

  </script>
